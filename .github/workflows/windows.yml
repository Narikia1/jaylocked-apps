# JayLocked for Windows, built and proven on a real Windows machine in the public repository
# Narikia1/jaylocked-apps. It builds a given commit of the private Narikia1/jaylocked (read with a read-only
# deploy key), walks through the app off-screen, installs the result, runs it, and keeps the installer, its SHA-256
# and the evidence as artifacts of the run. The installer also gets a signed record of where it was built (an
# attestation), which anyone can check with `gh attestation verify JayLocked-Setup.exe -R Narikia1/jaylocked-apps`.
# A release is made by hand from a green run's files.
#
# Every action is named by its full commit, so a moved tag can't change what runs here. Nothing is downloaded and
# run besides those actions, Node, .NET, the Rust version named in rust-toolchain.toml, and libmpv, the player
# (scripts/fetch-libmpv.mjs): one pinned build, taken only when the archive and the DLL in it have the SHA-256
# written in that script.
name: Windows

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit of Narikia1/jaylocked to build
        required: true

permissions:
  contents: read
  # For the attestation only: a short-lived identity for this run, and the right to store the record.
  id-token: write
  attestations: write

concurrency:
  group: windows
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
      AVALONIA_TELEMETRY_OPTOUT: 1
      # Exactly the packages in the committed lock files (apps/windows/*/packages*.lock.json); a restore that
      # would change them fails instead.
      RestoreLockedMode: true
      EVIDENCE: ${{ github.workspace }}\evidence
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: Narikia1/jaylocked
          ref: ${{ inputs.ref }}
          ssh-key: ${{ secrets.JAYLOCKED_SOURCE_KEY }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x

      - name: Generated files are current, and nothing is hardcoded
        run: |
          node scripts/generate.mjs --check
          node scripts/check-hygiene.mjs
          node scripts/check-secrets.mjs

      - name: Engine tests
        run: cargo test --locked --release --manifest-path engine/Cargo.toml

      - name: Engine for Windows
        shell: bash
        run: scripts/build-engine.sh windows

      - name: Keep a copy of libmpv, whose release is gone after about a month
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/libmpv-pin
          key: libmpv-${{ hashFiles('scripts/fetch-libmpv.mjs') }}

      - name: The pinned libmpv, checked against its SHA-256
        shell: pwsh
        run: |
          node scripts/fetch-libmpv.mjs --cache "$env:RUNNER_TEMP\libmpv-pin"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Walk through the app off-screen (setup, import, folders, logins, backup, lock, videos and music, libmpv playing from the vault)
        run: dotnet test apps/windows/JayLocked.Tests/JayLocked.Tests.csproj -r win-x64 -c Release

      - name: Publish
        run: dotnet publish apps/windows/JayLocked/JayLocked.csproj -r win-x64 -c Release --self-contained

      - name: Build the installer
        shell: pwsh
        run: |
          if (-not (Test-Path dist/windows/publish/jaylocked_engine.dll)) { throw 'The engine is missing from the app' }
          if (-not (Test-Path dist/windows/publish/libmpv-2.dll)) { throw 'The player is missing from the app' }
          # Inno Setup comes with the runner; nothing is fetched here. Without it the run stops.
          $iscc = Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup *\ISCC.exe" | Select-Object -First 1
          if (-not $iscc) { throw 'Inno Setup is not on this runner' }
          & $iscc.FullName apps\windows\installer\jaylocked.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $hash = (Get-FileHash dist\windows\JayLocked-Setup.exe -Algorithm SHA256).Hash.ToLower()
          # One line that `shasum -a 256 -c` reads on a Mac too: no carriage return, no byte order mark.
          [IO.File]::WriteAllText("$PWD\dist\windows\SHA256SUMS.txt", "$hash  JayLocked-Setup.exe`n")
          Get-Content dist\windows\SHA256SUMS.txt

      - name: Install silently, for this user only
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath dist\windows\JayLocked-Setup.exe -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait -PassThru
          if ($proc.ExitCode -ne 0) { exit $proc.ExitCode }
          $exe = "$env:LOCALAPPDATA\Programs\JayLocked\JayLocked.exe"
          if (-not (Test-Path $exe)) { throw "Not installed at $exe" }
          if (-not (Test-Path "$env:LOCALAPPDATA\Programs\JayLocked\libmpv-2.dll")) { throw 'The player was not installed' }
          if (-not (Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\JayLocked.lnk")) { throw 'No Start menu shortcut' }
          "EXE=$exe" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Run the installed app; its window must be left out of screen captures
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing, System.Windows.Forms
          New-Item -ItemType Directory -Force -Path $env:EVIDENCE | Out-Null
          $app = Start-Process -FilePath $env:EXE -PassThru
          Start-Sleep -Seconds 15
          if ($app.HasExited) { throw "The app exited with code $($app.ExitCode)" }
          # In front of everything, so the picture shows what a screen capture of JayLocked's window gets.
          Add-Type -AssemblyName Microsoft.VisualBasic
          [Microsoft.VisualBasic.Interaction]::AppActivate($app.Id)
          Start-Sleep -Seconds 2
          $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bitmap = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height
          $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
          $graphics.CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
          $bitmap.Save("$env:EVIDENCE\desktop-with-jaylocked-open.png", [System.Drawing.Imaging.ImageFormat]::Png)
          $graphics.Dispose(); $bitmap.Dispose()
          $app.CloseMainWindow() | Out-Null
          Start-Sleep -Seconds 5
          if (-not $app.HasExited) { Stop-Process -Id $app.Id -Force; Write-Host 'The app needed a forced close.' }

      - name: Uninstaller works
        shell: pwsh
        run: |
          $uninstaller = Get-ChildItem "$env:LOCALAPPDATA\Programs\JayLocked\unins*.exe" | Select-Object -First 1
          $proc = Start-Process -FilePath $uninstaller.FullName -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait -PassThru
          Write-Host "Uninstaller exit code: $($proc.ExitCode)"

      # Only an installer that passed every step above is kept, with its SHA-256 and its attestation.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/windows/JayLocked-Setup.exe
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: JayLocked-Setup
          path: |
            dist/windows/JayLocked-Setup.exe
            dist/windows/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: evidence
          path: evidence
          if-no-files-found: warn
          retention-days: 14
